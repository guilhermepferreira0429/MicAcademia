# Publishes the MicAcademia images to GHCR. The server pulls these by tag —
# it never sees the source, and never builds anything.
#
#   push to main  -> :latest        (pre-production)
#   git tag v1.2.3 -> :1.2.3, :1.2, :1  (immutable, what production pins to)
#
# Uses the repository's own GITHUB_TOKEN, so no registry secret to manage.
name: MicAcademia images

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/jobs/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mica-images.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: mica-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken image must not stop the other two from publishing; a partial
      # release is visible and fixable, a cancelled one just hides the failure.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: ./docker/Dockerfile.api
          - name: dashboard
            dockerfile: ./docker/Dockerfile.dashboard
          - name: jobs
            dockerfile: ./docker/Dockerfile.jobs

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/micacademia-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The dashboard build is heavy; without a shared cache every run pays
          # for the whole workspace again.
          cache-from: type=gha,scope=mica-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=mica-${{ matrix.name }}
          # The server is amd64. Building arm64 as well would double the time
          # for an image nobody pulls.
          platforms: linux/amd64
