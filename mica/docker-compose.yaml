# MicAcademia — the whole platform, for the server.
#
#   cd mica
#   cp .env.example .env      # fill it in, then chmod 600 .env
#   docker compose up -d --build
#
# Pre-production and production run this same file; what tells them apart is
# .env (domains, EasyPay in sandbox or live), never the topology.
#
# Every application container reads the SAME .env sitting next to this file, and
# no secret is written into the compose. What is inline here is either not a
# secret (ports, internal hostnames) or internal-only: Postgres and Redis are
# never published to the host, so their credentials never leave the compose
# network and are kept simple on purpose.
name: micacademia

# One env file, one path, every container. Change a secret in one place.
# Because it is named .env and sits beside this file, Docker also uses it for
# ${...} interpolation — so there is no second copy of anything.
x-app-env: &app-env
  env_file:
    - ./.env

services:
  # ─── Data ──────────────────────────────────────────────────────────────────
  # No host port: only the compose network reaches it, which is why the
  # credentials can be plain here.
  postgres:
    image: postgres:16-alpine
    container_name: mica-postgres
    environment:
      POSTGRES_DB: micacademia
      POSTGRES_USER: micacademia
      POSTGRES_PASSWORD: micacademia-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # A real query, not just pg_isready: that can pass while the server is
      # still in recovery, and the API then fails its first sign-in.
      test:
        ['CMD-SHELL', "pg_isready -U micacademia -d micacademia && psql -U micacademia -d micacademia -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mica-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Application ───────────────────────────────────────────────────────────
  api:
    <<: *app-env
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: mica-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Internal wiring only. Secrets come from the env file.
      NODE_ENV: production
      PORT: 3081
      DATABASE_URL: postgresql://micacademia:micacademia-internal@postgres:5432/micacademia
      REDIS_URL: redis://redis:6379
      # LIVEKIT_URL is deliberately NOT set here: the API hands that same URL to
      # the browser in the join token, so it must be the public wss:// address
      # from the env file, not the internal container name.
    healthcheck:
      # node:slim ships no curl; use Node's global fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  dashboard:
    <<: *app-env
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
      args:
        PUBLIC_IS_SELFHOSTED: 'true'
    container_name: mica-dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3082
      PUBLIC_IS_SELFHOSTED: 'true'
      PRIVATE_SERVER_URL: http://api:3081
    restart: unless-stopped

  # BullMQ workers: video processing, transcription, emails, maintenance.
  jobs:
    <<: *app-env
    build:
      context: ..
      dockerfile: docker/Dockerfile.jobs
    container_name: mica-jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://micacademia:micacademia-internal@postgres:5432/micacademia
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  # ─── Live classes ──────────────────────────────────────────────────────────
  # Its own Redis: LiveKit and Egress coordinate through it, and it must not
  # share a flush with the application queue.
  livekit-redis:
    image: redis:7-alpine
    container_name: mica-livekit-redis
    restart: unless-stopped

  livekit:
    <<: *app-env
    # Pin both LiveKit images to the versions you tested once the stack is up:
    # a recorder that changes under you mid-term is not what you want.
    image: livekit/livekit-server:latest
    container_name: mica-livekit
    depends_on:
      - livekit-redis
    environment:
      # LiveKit takes its whole configuration from this variable, so there is no
      # config file to keep in step with the compose. Only the secret comes from
      # .env — everything else is fixed infrastructure.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ''
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50200
          # Behind NAT the server must advertise the machine's public address,
          # or media never connects from outside the network.
          use_external_ip: true
        # Embedded TURN, for students behind a firewall that blocks UDP. If
        # 3478/udp cannot be opened, set enabled to false: clients then fall
        # back to TCP 7881, slower but working.
        turn:
          enabled: true
          udp_port: 3478
          domain: ${MICA_LIVEKIT_DOMAIN}
        redis:
          address: livekit-redis:6379
        # Attendance and recording events, over the internal network.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3081/webhooks/livekit
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    # Media is UDP and cannot go through the reverse proxy: these ports must be
    # open on the firewall. 7881 is the TCP fallback, 3478 the embedded TURN.
    ports:
      - '7881:7881'
      - '3478:3478/udp'
      - '50000-50200:50000-50200/udp'
    restart: unless-stopped

  # Records the class and uploads the MP4 to the videos bucket. Its whole
  # config, secret included, arrives as EGRESS_CONFIG_BODY from the env file.
  egress:
    <<: *app-env
    image: livekit/egress:latest
    container_name: mica-egress
    depends_on:
      - livekit
      - livekit-redis
    environment:
      # Same idea as LiveKit above: the config lives here, the secret in .env.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        logging:
          level: info
    # Chrome renders the room composite: it needs the larger shared memory and
    # SYS_ADMIN, or recordings crash part-way through.
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  # ─── Edge ──────────────────────────────────────────────────────────────────
  # Terminates TLS (automatic certificates) and routes the three public names.
  # LiveKit needs wss://, so this is not optional in production.
  caddy:
    <<: *app-env
    image: caddy:2-alpine
    container_name: mica-caddy
    depends_on:
      - dashboard
      - api
      - livekit
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
